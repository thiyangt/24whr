name: Daily Weather Scraper & Workbook Compiler

on:
  schedule:
    # Runs everyday at 23:30 UTC (Adjust as needed for your preferred local time)
    - cron: '30 23 * * *'
  workflow_dispatch: # Allows you to manually trigger it from the GitHub Actions tab anytime

jobs:
  run-weather-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to allow GitHub Actions to commit and push the updated .xlsx file back into your repository

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run main weather extraction script
        run: |
          python main.py

      - name: Commit and push updated dataset workbook
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update categorized daily weather excel workbook [skip ci]" && git push)
