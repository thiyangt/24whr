name: Daily Weather Scraper

on:
  schedule:
    - cron: '30 23 * * *' # Runs daily at 23:30 UTC
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to push generated data back to the repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run main weather script
        run: |
          python main.py

      - name: Commit and push updated dataset
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update daily weather dataset [skip ci]" && git push)
