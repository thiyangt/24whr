name: Automated 24-Hour Weather Compilation

on:
  schedule:
    # Runs everyday at 18:30 UTC (adjust timing as needed for Sri Lanka Standard Time 00:00)
    - cron: '30 18 * * *'
  workflow_dispatch: 

jobs:
  fetch-weather-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write 

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies and package
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Run weather extraction and tidy dataset generation
        run: |
          # Executes your package's main routine to scrape meteo.gov.lk and save daily file
          python -m meteo_compiler.cli run

      - name: Clean up files older than 3 months (90 days)
        run: |
          # Removes files older than 90 days in the data directory to maintain a 3-month window
          find data/ -type f -mtime +90 -exec rm {} +

      - name: Commit and push updated dataset files
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update daily 24-hour weather report dataset [skip ci]" && git push)
