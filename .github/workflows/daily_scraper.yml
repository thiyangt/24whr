name: Test Meteorology Connection

on:
  workflow_dispatch:

jobs:
  test-connection:
    runs-on: ubuntu-latest

    steps:
      - name: Test DNS
        run: |
          echo "Testing DNS..."
          nslookup meteo.gov.lk || true

      - name: Test HTTP
        run: |
          echo "Testing HTTP..."
          curl -I -L --connect-timeout 20 --max-time 60 http://meteo.gov.lk || true

      - name: Test HTTPS
        run: |
          echo "Testing HTTPS..."
          curl -I -L --connect-timeout 20 --max-time 60 https://meteo.gov.lk || true

      - name: Test PDF
        run: |
          echo "Testing PDF..."
          curl -I -L --connect-timeout 20 --max-time 60 \
            https://meteo.gov.lk/pdfs/twentyfour_pdf.pdf || true
